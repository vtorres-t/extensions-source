name: Sincronizar y Limpiar Fork

on:
  schedule:
    # Se ejecuta automáticamente todos los días a la medianoche (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out hijo (este repositorio)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Agregar repositorio padre (Upstream)
        run: |
          # URL por la del repositorio original (padre)
          git remote add upstream https://github.com/keiyoushi/extensions-source
          git fetch upstream main

      - name: Verificar si hay actualizaciones
        id: check_changes
        run: |
          # Compara la rama local 'main' con la del padre 'upstream/main'
          # Cambia 'main' por 'master' si es necesario
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "No hay actualizaciones en el repositorio padre."
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Se encontraron nuevas actualizaciones."
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Crear rama y aplicar cambios
        if: steps.check_changes.outputs.has_updates == 'true'
        id: merge_process
        run: |
          BRANCH_NAME="sync-upstream-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME upstream/main
          
          echo "Eliminando carpetas de idiomas no deseados en src..."
          for dir in src/*/; do
            folder_name=$(basename "$dir")
          
            if [ "$folder_name" != "en" ] && [ "$folder_name" != "all" ] && [ "$folder_name" != "es" ]; then
              echo "Borrando: src/$folder_name"
              rm -rf "$dir"
            fi
          done
          
          # Confirma la eliminación de las carpetas en la nueva rama
          git add .
          git commit -m "chore: eliminar carpetas no deseadas del padre" || true
          
          # Intenta fusionar la nueva rama sobre la rama principal del hijo (main)
          git checkout main
          
          if git merge --no-ff $BRANCH_NAME -m "merge: actualizaciones del padre sin carpetas excluidas"; then
            echo "Merge exitoso y sin conflictos."
            git push origin main
          
            # Limpieza: elimina la rama temporal local y remota
            git branch -d $BRANCH_NAME
          else
            echo "::error::Conflictos detectados durante el merge. Se requiere intervención manual."
            git merge --abort
            exit 1
          fi
