name: Syc Fork orig

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: orig
          fetch-depth: 0
          token: ${{ secrets.BUILD_PREVIEW_TOKEN }}

      - name: Sincronizar rama orig con el repositorio padre
        env:
          GH_TOKEN: ${{ secrets.BUILD_PREVIEW_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          gh repo sync ${{ github.repository }} --branch orig
